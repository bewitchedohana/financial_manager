name: Build
on: [push]

jobs:
    build-backend:
        runs-on: ubuntu-latest
        name: Build backend
        defaults:
          run:
            working-directory: backend
        steps:
          - uses: actions/checkout@v4
            name: Checkout backend
          - uses: actions/setup-dotnet@v4
            name: Setup dotnet
            with:
                dotnet-version: 9.0.300
          - name: Build backend
            run: dotnet build --configuration Release src/API
            
    build-frontend:
        runs-on: ubuntu-latest
        name: Build frontend
        defaults:
          run:
            working-directory: frontend
        steps:
          - uses: actions/checkout@v4
          - uses: actions/setup-node@v4
            name: Build frontend
            with:
                node-version: '20.x'
          - run: npm install
          - run: npm run build
